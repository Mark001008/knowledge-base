spring:
  application:
    name: knowledge-base

server:
  port: 8080
  address: 0.0.0.0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: CHANGED_PLEASE_SET_JWT_SECRET_ENV_VAR
  expires-in: 7200

storage:
  type: local
  local:
    base-path: ./storage
    bucket: kb-documents
